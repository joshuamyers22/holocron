site_name: Holocron
site_description: Independent Python implementation of the R rms workflow
site_url: https://joshuamyers22.github.io/holocron/
repo_url: https://github.com/joshuamyers22/holocron
repo_name: joshuamyers22/holocron
docs_dir: docs
site_dir: .work/site
strict: true

theme:
  name: mkdocs
  locale: en

markdown_extensions:
  - admonition

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Guides:
      - Data distributions: guides/data-distributions.md
      - Formulas and numeric designs: guides/formulas-and-designs.md
      - Restricted cubic splines: guides/restricted-cubic-splines.md
      - Ordinary least squares: guides/ordinary-least-squares.md
      - Generalized and logistic models: guides/generalized-models.md
      - Post-estimation operations: guides/post-estimation.md
      - Penalties and alternative covariance: guides/regularization-and-covariance.md
      - Ordinal regression and censoring: guides/ordinal-censoring.md
      - Survival models: guides/survival-models.md
      - Extended model replacements: guides/extended-models.md
      - Multiple-imputation pooling: guides/multiple-imputation.md
      - Namespace disposition: guides/namespace-disposition.md
      - Performance profiles: guides/performance-profiles.md
      - Simulation and numerical edges: guides/simulation-and-edge-evidence.md
      - Exact resample plans: guides/resampling.md
      - Probability and survival validation: guides/validation-metrics.md
      - Diagnostics and selection: guides/diagnostics-and-selection.md
      - Backend-neutral plot specifications: guides/plot-specifications.md
      - Nomogram geometry and SVG: guides/nomograms.md
      - SVG accessibility and visual assurance: guides/svg-assurance.md
      - Structured tables and LaTeX: guides/reporting.md
      - Serialization and reconstruction: guides/serialization.md
      - R migration: guides/r-migration.md
  - Examples:
      - End-to-end vertical slice: examples/vertical-slice.md
      - Gallery:
          - Adjusted effects and inference: examples/gallery/effects-and-inference.md
          - Validation and calibration: examples/gallery/validation-and-calibration.md
          - Survival curves and validation: examples/gallery/survival.md
          - Diagnostics and robustness: examples/gallery/diagnostics.md
          - Nomogram and reporting: examples/gallery/nomogram-and-reporting.md
  - Compatibility: compatibility.md
  - API reference:
      - Design: api/design.md
      - Formula: api/formula.md
      - Graphics: api/graphics.md
      - Models: api/models.md
      - Reporting: api/reporting.md
      - Validation: api/validation.md
      - Exceptions: api/exceptions.md
  - Interpretation and limitations: interpretation-and-limitations.md
  - Development: development.md
  - Releases: releases.md
  - Engineering reference:
      - Package structure: architecture/PACKAGE_STRUCTURE.md
      - Frozen environments: reproducibility/FROZEN_ENVIRONMENTS.md
      - Agentic verification: AGENTIC_VERIFICATION_GUIDE.md
      - Bayesian regression implementation: BAYESIAN_REGRESSION_IMPLEMENTATION.md
      - Statistical learning point of view: STATISTICAL_LEARNING_POINT_OF_VIEW.md
  - Decisions:
      - ADR 001 — Independent oracle: adr/ADR-001-independent-oracle.md
      - ADR 002 — Package identity: adr/ADR-002-project-and-package-identity.md
      - ADR 003 — Reference freeze: adr/ADR-003-reference-freeze-and-update-policy.md
      - ADR 004 — Compatibility contract: adr/ADR-004-compatibility-contract.md
      - ADR 005 — Formula and design engine: adr/ADR-005-formula-design-engine.md
      - ADR 006 — Canonical data boundary: adr/ADR-006-canonical-data-boundary.md
      - ADR 007 — Numerical backends: adr/ADR-007-numerical-backends.md
      - ADR 008 — Model and result serialization: adr/ADR-008-model-result-serialization.md
