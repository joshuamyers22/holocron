name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: make setup
      - run: make check
      - run: make phase-1-exit-gate
      - run: make phase-2-exit-gate
      - run: make phase-3-evidence-clean
      - run: make phase-4-evidence-clean
      - run: make phase-5-evidence-clean
      - name: Retain Phase 1 parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-1-parity-evidence-${{ github.sha }}
          path: .work/phase-1-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain Phase 2 exit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-2-exit-evidence-${{ github.sha }}
          path: .work/phase-2-evidence/phase-2-exit.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain Phase 3 simulation and edge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-3-evidence-${{ github.sha }}
          path: .work/phase-3-evidence/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain Phase 4 exit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-4-exit-evidence-${{ github.sha }}
          path: .work/phase-4-evidence/phase-4-exit.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Retain Phase 5 simulation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-simulation-evidence-${{ github.sha }}
          path: .work/phase-5-evidence/simulation-report.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - run: make audit clean-build
  tolerance-pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: make setup
      - name: Exercise Phase 3 estimators and operations on the platform matrix
        run: uv run --frozen python -m unittest tests.test_generalized_models tests.test_postfit_operations tests.test_regularization_covariance
      - name: Exercise Phase 5 survival estimators and validation on the platform matrix
        run: uv run --frozen python -m unittest tests.test_survival_models tests.test_survival_validation tests.test_phase_5_simulations
      - name: Exercise Phase 6 validation, diagnostics, and failure policies on the platform matrix
        run: uv run --frozen python -m unittest tests.test_resampling tests.test_model_validation tests.test_probability_validation tests.test_survival_validation tests.test_optimism_correction tests.test_diagnostics_selection tests.test_resample_reporting
      - name: Exercise Phase 7 plot contracts and SVG on the platform matrix
        run: uv run --frozen python -m unittest tests.test_plot_specifications tests.test_plot_adapters_renderers
      - name: Exercise Phase 3 simulation thresholds on the platform matrix
        run: uv run --frozen python -m tools.run_phase_3_evidence --simulation-output ".work/phase-3-platform/simulation-report.json" --edge-output ".work/phase-3-platform/numerical-edge-report.json"
      - name: Exercise Phase 4 evidence on the platform matrix
        run: uv run --frozen python -m tools.run_phase_4_evidence --output ".work/phase-4-platform/phase-4-exit.json"
      - name: Exercise Phase 5 simulations on the platform matrix
        run: uv run --frozen python -m tools.run_phase_5_simulations --output ".work/phase-5-platform/simulation-report.json"
      - name: Retain platform Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-3-platform-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .work/phase-3-platform/*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Retain platform Phase 4 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-4-platform-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .work/phase-4-platform/phase-4-exit.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Retain platform Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-5-platform-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: .work/phase-5-platform/simulation-report.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - run: uv run --frozen python -m tools.run_tolerance_pilot --output ".work/tolerance-${{ runner.os }}-${{ runner.arch }}.json"
