[project]
name = "holocron-rms"
version = "0.1.0"
description = "Independent Python implementation of the R rms package"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "numpy>=2,<3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/joshuamyers22/holocron"
Issues = "https://github.com/joshuamyers22/holocron/issues"
Changelog = "https://github.com/joshuamyers22/holocron/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holocron"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/binary-logistic-result.schema.json" = "holocron/schemas/binary-logistic-result.schema.json"
"schemas/cox-result.schema.json" = "holocron/schemas/cox-result.schema.json"
"schemas/cox-result-v2.schema.json" = "holocron/schemas/cox-result-v2.schema.json"
"schemas/data-distribution.schema.json" = "holocron/schemas/data-distribution.schema.json"
"schemas/design-matrix.schema.json" = "holocron/schemas/design-matrix.schema.json"
"schemas/design-spec.schema.json" = "holocron/schemas/design-spec.schema.json"
"schemas/formula.schema.json" = "holocron/schemas/formula.schema.json"
"schemas/ols-result.schema.json" = "holocron/schemas/ols-result.schema.json"
"schemas/nonparametric-survival-result.schema.json" = "holocron/schemas/nonparametric-survival-result.schema.json"
"schemas/nonparametric-survival-result-v2.schema.json" = "holocron/schemas/nonparametric-survival-result-v2.schema.json"
"schemas/ordinal-result.schema.json" = "holocron/schemas/ordinal-result.schema.json"
"schemas/parametric-survival-result.schema.json" = "holocron/schemas/parametric-survival-result.schema.json"
"schemas/parametric-survival-result-v2.schema.json" = "holocron/schemas/parametric-survival-result-v2.schema.json"
"schemas/serialization-manifest.json" = "holocron/schemas/serialization-manifest.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/holocron",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "schemas/binary-logistic-result.schema.json",
    "schemas/cox-result.schema.json",
    "schemas/cox-result-v2.schema.json",
    "schemas/data-distribution.schema.json",
    "schemas/design-matrix.schema.json",
    "schemas/design-spec.schema.json",
    "schemas/formula.schema.json",
    "schemas/ols-result.schema.json",
    "schemas/nonparametric-survival-result.schema.json",
    "schemas/nonparametric-survival-result-v2.schema.json",
    "schemas/ordinal-result.schema.json",
    "schemas/parametric-survival-result.schema.json",
    "schemas/parametric-survival-result-v2.schema.json",
    "schemas/serialization-manifest.json",
]
exclude = [
    "/data",
    "/docs",
    "/environments",
    "/governance",
    "/notebooks",
    "/notes",
    "/reference",
    "/templates",
    "/tests",
    "/tools",
]

[dependency-groups]
dev = [
    "editables==0.5",
    "hatchling==1.32.0",
    "jsonschema==4.26.0",
    "mkdocs==1.6.1",
    "pyright==1.1.414",
    "ruff==0.16.7",
]

[tool.uv]
required-version = "==0.12.7"
no-build-isolation-package = ["holocron-rms"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests", "tools", "reference"]
